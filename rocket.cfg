# TVC landing rocket settings
# Units: meters, kilograms, seconds, newtons. Anything ending in _deg is degrees.
# Positions along the rocket are measured UP from the bottom of the rocket (the aft end of the ascent motor).
# Every setting has to be here. Numbers marked VERIFY are not in the CAD or a datasheet yet, they are a guess.
# The rocket itself (mass, CG, inertia, every joint, linkage and contact point) comes from the Fusion CAD,
# see vehicle/vehicle.json and docs/CAD_INTEGRATION.md. What is below is what the CAD can't say.

# --- The CAD rocket ---
vehicle_file = vehicle/vehicle.json   # made by tools/build_vehicle.py from the Fusion design TVC_Rocket_Gimbal_v3 (v14)
vehicle_model = 1            # 1 = tell the flight computer the CAD mass, CG and inertia. 0 = tell it the dry_* numbers below
mechanism_dt = 0.0005        # s, sub-step for the gimbal, claws and legs (their stops are stiff)

# --- Rocket body ---
body_diameter = 0.0795       # CAD: outer radius of the printed shells is 39.75 mm
body_length = 0.639          # CAD: aft end of the ascent motor to the nose tip
dry_mass = 0.752             # used only with vehicle_model = 0. Everything except the two motors, no reaction wheel (CAD)
dry_cg = 0.240               # used only with vehicle_model = 0
dry_inertia_pitch = 0.017    # used only with vehicle_model = 0. About the dry CG
dry_inertia_roll = 0.0008    # used only with vehicle_model = 0
dry_cg_legs_out = 0.240      # used only with vehicle_model = 0. The same with the four legs swung out
dry_inertia_pitch_legs_out = 0.017
dry_inertia_roll_legs_out = 0.0008

# --- Aerodynamics (guesses until a drop test) ---
cd_nose_first = 0.6          # going up
cd_tail_first = 0.9          # falling engine first, blunt end into the wind
cn_alpha = 2.0               # normal force slope per radian
cd_crossflow = 1.2           # drag of the tube going sideways
cp_nose_first = 0.50         # CP from RocketPy with the CAD nose profile, see validation/compare_rocketpy.py
cp_tail_first = 0.32
cd_leg = 1.1                 # drag of a leg tube in crossflow (a smooth cylinder is about 1.2)
cd_foot = 0.5                # drag of a foot ball (a sphere is about 0.47)

# --- Motors: two F15s stacked. The landing motor kicks the spent ascent motor out the bottom ---
motor_file = motors/Estes_F15.eng
motor_position = 0.057       # center of the ascent (bottom) motor. CAD: it spans 0 to 0.114
motor_length = 0.114
motor_gap = 0.012            # CAD: space between the two motors (the landing motor spans 0.126 to 0.240)
eject_speed = 5.0            # how fast the spent case leaves, m/s
ascent_ignition_delay = 0.2  # time from fire command to thrust
landing_ignition_delay = 0.3
ascent_thrust_scale = 1.0
landing_thrust_scale = 1.0
landing_motor = 1            # 0 = ascent motor only (used for checking against RocketPy)
thrust_roughness = 0.03      # black powder doesn't burn smoothly, share of thrust
roll_torque = 0.0002         # N m of spin from the motor and small asymmetries

# --- Thrust blocker claws in the landing motor's exhaust (like BPS.space Scout F) ---
throttle_min = 0.6           # thrust left with both claws fully closed

# --- TVC mount ---
gimbal_position = 0.134      # CAD: pivot point
gimbal_misalignment_y_deg = 0.3   # no mount is perfectly straight
gimbal_misalignment_z_deg = -0.2

# --- The five servos: KST X08H Plus (TVC yaw, TVC pitch, blocker left, blocker right, leg keeper) ---
servo_supply_volts = 7.4     # VERIFY: what the real flight computer feeds them. The datasheet rows are 6.0 V and 7.4 V
servo_stall_torque = 0.474   # N m at 7.4 V (datasheet 4.83 kg cm). Its top speed drops to zero as the load reaches this
servo_speed_deg = 500        # deg/s with no load at 7.4 V (datasheet 0.12 s / 60 deg, rounded down)
servo_update_rate = 50       # Hz. VERIFY: 50 Hz for an analog-style refresh, a digital one takes up to 333 Hz
servo_deadband_deg = 0.2     # changes smaller than this are ignored (datasheet dead band)
servo_lag = 0.02             # s, the servo's own response on top of its speed limit

# --- Hardware imperfections of a 3D printed rocket (directions are random each flight) ---
gimbal_wobble_hz = 20        # printed mount and linkage flex, so the gimbal rings. 0 = perfectly stiff
gimbal_wobble_damping = 0.2  # how fast that ringing dies out (0 = never, 1 = no ringing)
control_delay = 0.005        # s from reading the sensors to the servos getting the command
cg_offset = 0.003            # m, CG off the centerline (battery placement etc.)
eject_kick_deg = 2.0         # the spent case leaves this far off-axis, twisting the rocket
blocker_effectiveness = 1.0  # how hard the claws really block compared with what we expect
blocker_erosion = 0.3        # share of their blocking the claws lose by the end of the burn
blocker_side_force = 0.05    # share of the blocked thrust pushed sideways, away from the claw. VERIFY
blocker_servo_offset_r_deg = 0   # horn clocked wrong on its spline, added to every command (random in the Monte Carlo)
blocker_servo_offset_l_deg = 0

# --- Backlash: lost motion in every joint, from the CAD clearances (a hole radius minus the pin radius, doubled) ---
# backlash_scale multiplies all of them: 0 = a perfect rocket, 1 = the CAD, 2 = loose printing
backlash_scale = 1
backlash_servo_deg = 0.3                # servo output gear train. Not in the CAD, a typical metal-gear servo. VERIFY
backlash_tvc_horn_end_mm = 0.1          # horn end of a pushrod (U-joint cross, 1 mm pin in a printed hole). VERIFY: hole not in the export
backlash_tvc_ujoint_mm = 0.1            # the second axis of the same U-joint. VERIFY
backlash_tvc_drive_end_mm = 0.1         # CAD: pushrod bore r 1.30 on a cartridge stud r 1.25, 0.05 radial = 0.1 across
backlash_tvc_yaw_axle_deg = 0.2         # CAD: bores r 1.7 / 3.0 around an M3 axle: 0.2 mm over the axle spacing. VERIFY pin size
backlash_tvc_pitch_axle_deg = 0.2       # CAD: bores r 3.0 / 4.0 / 4.7 (bearing seats). Same assumption. VERIFY
backlash_blocker_horn_pin_mm = 0.2      # CAD: link hole r 1.1 on a 2 mm dowel (r 1.0): 2 x 0.1
backlash_blocker_claw_pin_mm = 0.15     # CAD: tab hole r 1.05 and claw hole r 1.025 on the same dowel: 2 x (0.05 + 0.025)
backlash_claw_pivot_mm = 0.2            # CAD: claw bore r 1.6 on an M3 bolt (r 1.5): 2 x 0.1
backlash_keeper_slot_mm = 0.3           # CAD: M2 set screw (2.0) in a 2.3 slot
backlash_leg_latch_mm = 0.2             # CAD: 3.0 plunger pin in a 3.2 hole. At the 22 mm plunger arm that is the leg's rattle when latched
# The leg hinge pins have 0.05 to 0.1 mm of radial play (bore r 1.55 to 1.6, pin r 1.5): under 0.1 mm at the foot, below
# anything the sim resolves, so it has no line of its own.

# --- Leg keeper, leg springs, latch and feet ---
keeper_release_spread_deg = 0.15   # each leg's peg lets go at a slightly different ring angle (CAD: 9.1 deg nominal). VERIFY
leg_spring_k = 0.0313              # N m per radian, torsion spring from the wire formula (E 200 GPa, d 0.7, D 4, 6 turns). VERIFY
leg_spring_torque_deployed = 0.06  # N m left in the spring when the leg is at its 119 deg stop (handoff)
leg_hinge_friction = 0.002         # N m, 3 mm pin with a few N on it. VERIFY
leg_stop_restitution = 0.2         # share of speed a leg keeps when it hits its stop. VERIFY
plunger_force_start = 1.0          # N, spring plunger pushing on its ramp where the ramp starts (91 deg). VERIFY
plunger_force_end = 2.5            # N, at the latch (119 deg). VERIFY
plunger_ramp_friction = 0.3        # printed plastic on printed plastic. VERIFY
plunger_ramp_rise = 0.003          # m, how far the ramp pushes the plunger in. CAD: about 3 mm over 28 deg
plunger_shear_limit = 800          # N the plunger pin and hole survive (620 N at the 54 N design load, times a safety factor of 1.3). VERIFY
foot_crush_stress = 85000          # Pa, EPS ball crush stress (0.085 MPa from the material notes. VERIFY: another note says 0.11)
tube_modulus = 70e9                # Pa, carbon tube bending stiffness. VERIFY: 35 to 138 GPa depending on the layup

# --- Sensors: BMI088 / ICM-42688 IMU on foam, MS5611 / BMP390 barometer, u-blox M9/M10 GPS ---
gyro_noise_deg = 0.05        # deg/s per reading
gyro_bias_deg = 1.0          # deg/s, measured on the pad
gyro_scale_error = 0.005     # gyro reads up to about 0.5% high or low
vibration_gyro_deg = 0.3     # extra gyro noise while a motor burns
accel_noise = 0.05           # m/s^2 per reading
accel_bias = 0.1             # m/s^2 per axis
vibration_accel = 0.5        # extra accelerometer noise while a motor burns
imu_misalignment_deg = 0.2   # IMU mounted slightly crooked (checked with a jig)
baro_noise = 0.1             # m per reading
baro_lag = 0.02              # s
baro_airspeed_error = 0.05   # share of the airflow pressure that leaks in (with static ports)
gps_rate = 10                # Hz
gps_latency = 0.1            # s, how old each velocity fix is when it arrives
gps_latency_jitter = 0.03    # s, each fix's age is off by up to this
gps_velocity_noise = 0.1     # m/s
gps_dropout = 0.05           # chance any one fix goes missing
gps_outage_rate = 0.03       # chance per second of losing lock for 1-3 s
gps_multipath_height = 2     # m, below this, signals bouncing off the ground double the noise
gps_glitch = 0.005           # chance a fix is just wrong

# --- Flight computer ---
tvc_enabled = 1              # 0 = gimbal stays centered
control_rate = 100           # Hz
launch_time = 2              # seconds on the pad (averaging the sensors) before lighting
kp = 25                      # steering: angular acceleration per radian off target
kd = 7                       # steering: angular acceleration per rad/s of turning
estimator_gain = 1.0         # how hard the altitude estimate trusts the barometer
gps_velocity_gain = 0.3      # share of each GPS velocity error we correct
landing_brake = 3.5          # planned braking, m/s^2. Under what the motor can do, so the blockers have room
touchdown_speed = 0.5        # how fast to come down the last bit, m/s
max_fire_tilt_deg = 40       # wait to light the landing motor while tipped more than this (unless it's urgent)
drift_kill_time = 0.7        # lean to reach the sideways speed we want within this many seconds
pad_return = 1               # head back toward the pad at this many m/s per meter away (position from the velocity estimate)
pad_return_height = 30       # landing burn: below this, head for the pad more and more gently, so we touch down without sliding
max_lean_deg = 20            # most lean in the landing burn
boost_max_lean_deg = 4       # most lean in the boost. More gets closer to the pad, but the coast tumbles more in wind (5 deg: 92%)
leg_release_speed = 3        # m/s falling: past the top of the flight, once it is going down this fast the keeper lets the legs go.
                             # VERIFY: the leg springs lose to the airflow above about 15 m/s, so it has to be early

# --- Launch day ---
launch_tilt_deg = 0
wind_speed = 2               # m/s at wind_height
wind_direction_deg = 0       # direction the wind blows toward, 0 = +x
gust_strength = 0.25         # gusts, as a share of the wind speed
wind_height = 10             # m, where wind_speed is measured. 10 = weather forecast, 2 = handheld meter
wind_shear = 0.15            # how much slower the wind gets near the ground. 0.1 open field, 0.25 trees around

# --- The ground (the feet and legs are in the CAD) ---
ground_stiffness = 20000     # N/m of the grass under one foot, before the leg tube bends. VERIFY
max_touchdown_speed = 4.0    # m/s the legs survive before breaking
bounciness = 0.1             # share of impact speed the grass and struts give back
ground_friction = 0.5        # feet on grass
ground_slope_deg = 1         # pick a flat field, but it's never quite level
ground_slope_direction_deg = 0   # which way is uphill, 0 = +x
ground_bumps = 0.01          # m, typical height of the lumps in the grass (0.02 = rough pasture)
ground_bump_size = 1.5       # m, typical distance between lumps (1.0 = rough pasture)
ground_softness = 0.2        # how much softer or harder patches of ground get (share)

# --- Simulation ---
physics_dt = 0.001
max_time = 60

# --- Monte Carlo spreads (1 standard deviation unless noted) ---
mc_dry_mass_percent = 1      # you'll weigh the real rocket, so the flight computer knows its mass well
mc_dry_cg = 0.01
mc_thrust_percent = 1.5      # F15s are about 1-2% motor to motor (BPS.space tests)
mc_ignition_delay = 0.09     # igniter timing is the big one, about +-180 ms (BPS.space)
mc_misalignment_deg = 0.25
mc_launch_tilt_deg = 1
mc_max_wind = 5              # picked evenly between 0 and this
mc_blocker_effect = 0.15     # spread in blocker effectiveness
mc_baro_airspeed = 0.5       # spread in how much airflow leaks into the barometer (share)
mc_max_slope_deg = 2         # field slope picked evenly between 0 and this, any direction
mc_backlash_spread = 0.3     # every backlash_* line is scaled by 1 + this x a random number, independently per joint
mc_servo_offset_deg = 0.5    # blocker horn clocking error
mc_leg_spring_percent = 10   # leg spring stiffness and preload
mc_foot_crush_percent = 15   # EPS ball crush stress
